aid: tresata
name: Tresata
description: >-
  Tresata is a Charlotte, North Carolina enterprise software company building what it
  describes as the foundational data layer for agentic AI. Its platform is marketed
  under the product names AB (Asset Builder), AU (Unreal Data Engine) and AF (Agent
  Foundation), alongside the Deduce and Discover surfaces, and automates data accuracy,
  entity resolution and enrichment across AWS, Azure and Google Cloud with a low-code
  interface. Pricing is usage-based, metered in Tresata Transaction Units (TTUs).
  Tresata publishes first-party open-source Scala/Spark libraries under the com.tresata
  group on Maven Central and co-authors the NANDini research effort with MIT on
  decentralised agentic data architectures. As of this profile it operates no public
  developer program: the platform is reached only through a login-gated tenant
  application, and no API reference, OpenAPI, GraphQL SDL, AsyncAPI or other
  machine-readable contract is published on any Tresata host.
